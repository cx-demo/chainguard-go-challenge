apiVersion: v1
kind: Namespace
metadata:
  name: remediated-chainguard
  labels:
    app.kubernetes.io/name: remediated-chainguard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: remediated-chainguard
  namespace: remediated-chainguard
  labels:
    app.kubernetes.io/name: remediated-chainguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: remediated-chainguard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: remediated-chainguard
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: hello-server:remediated-chainguard
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 250m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: remediated-chainguard
  namespace: remediated-chainguard
  labels:
    app.kubernetes.io/name: remediated-chainguard
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: remediated-chainguard
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
